# JD 概念映射库
# 概念不是同义词关系，而是「包含关系」：
# JD 中提到概念名（如"高并发"），简历中只要出现任一关联词即视为匹配
# 每个概念包含：concept（JD中的说法）、related（简历中可能出现的关联词）、hint（匹配提示）

# ─── 系统架构类 ───
- concept: 高并发
  related: [QPS, TPS, 并发, 高可用, 高性能, 限流, 降级, 熔断, 熔断器, 万级, 十万级, 百万级, 千万级, 高吞吐, 吞吐量, 响应时间, RT, 延迟, 请求量]
  hint: 高并发能力可通过量化指标（QPS/TPS/用户量）或架构手段（限流/降级/熔断）体现

- concept: 分布式
