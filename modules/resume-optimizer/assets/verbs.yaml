# 动词库配置
# 用于 Bullet 文本修复和优化

# 强动词：用于前置补充，让 bullet 更有力度
strong_verbs:
  创造类:
    - 主导
    - 设计
    - 搭建
    - 构建
    - 创立
    - 发明
    - 提出
    - 开创

  优化类:
    - 优化
    - 提升
    - 改进
    - 降低
    - 压缩
    - 加速
    - 重构
    - 精简

  分析类:
    - 分析
    - 调研
    - 评估
    - 诊断
    - 排查
    - 定位
    - 研究
    - 探索

  管理类:
    - 推动
    - 组织
    - 协调
    - 带领
    - 分配
    - 规划
    - 主办
    - 统筹

  技术类:
    - 实现
    - 开发
    - 封装
    - 部署
    - 集成
    - 迁移
    - 编写
    - 落地

# 已有动词：如果 bullet 已以这些词开头，则不需要补充
existing_verbs:
  - 主导
  - 独立完成
  - 设计
  - 落地
  - 推动
  - 优化
  - 沉淀
  - 实现
  - 开发
  - 封装
  - 部署
  - 集成
  - 迁移
  - 搭建
  - 构建
  - 使用
  - 基于
  - 引入
  - 负责
  - 参与
  - 产出
  - 编写
  - 重构
  - 分析
  - 调研
  - 组织
  - 协调
  - 带领

# 弱动词：应该替换而非叠加
weak_verbs:
  - 做了
  - 进行了
  - 完成了
  - 弄了
  - 搞了
  - 处理了

# 动词选择规则：根据 bullet 内容关键词选择合适的强动词
verb_selection_rules:
  - keywords: [论文, 投稿, paper, 发表]
    verb: 产出
    examples: [产出论文 X 篇, 产出技术博客]

  - keywords: [搭建, 构建, 实现, 开发, 封装]
    verb: 主导
    examples: [主导 X 系统搭建, 主导核心模块开发]

  - keywords: [优化, 提升, 改进, 降低]
    verb: 推动
    examples: [推动性能优化, 推动流程改进]

  - keywords: [编写, 博客, 文档, 系列]
    verb: 沉淀
    examples: [沉淀技术文档, 沉淀最佳实践]

  - keywords: [分析, 调研, 评估]
    verb: 完成
    examples: [完成技术调研, 完成竞品分析]

# 默认动词：无法匹配时使用
default_verb: 主导