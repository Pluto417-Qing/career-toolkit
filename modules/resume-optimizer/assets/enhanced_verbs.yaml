# 强动词库（按类别分组）
# 用于简历表达优化

# ═══════════════════════════════════════════
# 技术类动词
# ═══════════════════════════════════════════

technical:
  design:
    - 设计          # 设计系统架构
    - 规划          # 规划技术方案
    - 制定          # 制定技术规范
    - 构建          # 构建技术体系
    - 架构          # 架构系统
    - 搭建          # 搭建基础设施
  
  implement:
    - 实现          # 实现功能模块
    - 开发          # 开发核心功能
    - 编写          # 编写高质量代码
    - 研发          # 研发新技术
    - 落地          # 落地技术方案
    - 部署          # 部署生产环境
  
  optimize:
    - 优化          # 优化性能
    - 重构          # 重构代码
    - 改进          # 改进系统
    - 提升          # 提升效率
    - 调优          # 调优参数
    - 精简          # 精简流程

# ═══════════════════════════════════════════
# 影响类动词
# ═══════════════════════════════════════════

impact:
  lead:
    - 主导          # 主导项目
    - 引领          # 引领团队
    - 推动          # 推动变革
    - 驱动          # 驱动创新
    - 牵头          # 牵头落地
  
  influence:
    - 影响          # 影响决策
    - 促进          # 促进合作
    - 赋能          # 赋能团队
    - 启发          # 启发思路
    - 带动          # 带动发展
  
  result:
    - 达成          # 达成目标
    - 实现          # 实现突破
    - 取得          # 取得成果
    - 创造          # 创造价值
    - 贡献          # 贡献力量

# ═══════════════════════════════════════════
# 协作类动词
# ═══════════════════════════════════════════

collaboration:
  coordinate:
    - 协调          # 协调资源
    - 统筹          # 统筹全局
    - 组织          # 组织活动
    - 安排          # 安排任务
  
  cooperate:
    - 协同          # 协同工作
    - 配合          # 配合团队
    - 支持          # 支持项目
    - 协助          # 协助落地

# ═══════════════════════════════════════════
# 创新类动词
# ═══════════════════════════════════════════

innovation:
  create:
    - 创新          # 创新方案
    - 独创          # 独创技术
    - 突破          # 突破难题
    - 开创          # 开创先河
  
  explore:
    - 探索          # 探索新方向
    - 尝试          # 尝试新技术
    - 实验          # 实验验证
    - 验证          # 验证假设

# ═══════════════════════════════════════════
# 弱动词 → 强动词替换映射
# ═══════════════════════════════════════════

weak_to_strong:
  # 基础弱动词
  负责: 主导
  参与: 贡献
  协助: 支持
  学习: 掌握
  了解: 深入理解
  
  # 需要具体化的弱动词
  进行: 执行
  开展: 推动
  推进: 驱动
  配合: 协同
  
  # 形容词性弱动词
  做了: 完成
  搞了: 实现
  弄了: 开发
  写了: 编写
  
  # 模糊性弱动词
  工作: 贡献
  任务: 项目
  内容: 核心模块
  东西: 关键组件

# ═══════════════════════════════════════════
# 行业术语替换
# ═══════════════════════════════════════════

industry_terms:
  # 前端
  前端开发: 前端工程
  写页面: 实现用户界面
  切图: 构建响应式布局
  调样式: 优化视觉呈现
  
  # 后端
  后端开发: 服务端工程
  写接口: 设计并实现 API
  增删改查: 实现核心业务逻辑
  
  # 通用
  很多: 多项
  一些: 若干
  大量: 丰富的
  各种: 多元化的
  
  # 量化替换
  很多用户: 月活 10 万+ 用户
  高并发: QPS 1000+
  性能好: 性能提升 30%
  稳定性高: 可用性 99.9%

# ═══════════════════════════════════════════
# 句式模板
# ═══════════════════════════════════════════

templates:
  # STAR 模板
  star:
    situation: "在{context}场景下，"
    task: "负责{task}，"
    action: "通过{action}，"
    result: "实现了{result}。"
  
  # 量化结果模板
  quantified:
    - "{action}{target}，{metric}{value}{unit}"
    - "通过{action}，使{metric}从{old_value}降至{new_value}"
    - "主导{project}，覆盖{scope}，服务{users}用户"
  
  # 影响力模板
  impact:
    - "{action}{target}，{result}，影响{impact_scope}"
    - "推动{initiative}，提升{metric}{percent}%"
    - "构建{system}，支撑{business}业务"