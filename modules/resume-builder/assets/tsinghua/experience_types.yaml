# 清华特有经历类型与写作模板
# Agent 在对话收集阶段，主动询问以下经历，避免学生遗漏
# 每个类型附带「该经历的 bullet 写作模板」，确保真实且有量化

# ─── 科研经历 ───
- type: SRT 计划（Student Research Training）
  description: 清华本科生科研训练计划，大一/大二即可参加
  common_roles: [项目负责人, 参与学生]
  writing_template: "[在XX实验室]参与SRT项目「{课题名}」，负责{具体工作}，产出{论文/专利/原型系统}，{量化结果}"
  example: "在智能技术与系统实验室参与SRT项目「基于图神经网络的推荐系统」，负责特征工程和模型训练，对比基线提升Recall@10 8.3%，产出1篇 ICASSP 投稿"

- type: 国创 / 北创（国家级/北京市级大学生创新训练计划）
  description: 本科生创新项目，有经费支持，为期一年
  common_roles: [项目负责人, 核心成员]
  writing_template: "作为{角色}参与{国创/北创}项目「{课题名}」，主导{具体工作}，{量化结果}，{结题优秀/获评优秀项目}"
  example: "作为项目负责人主持国创项目「联邦学习隐私保护框架」，设计3种差分隐私方案，结题获评优秀项目"

- type: 挑战杯
  description: 清华校内最大的学生课外学术科技赛事
  common_roles: [队长, 队员]
  writing_template: "组队参加挑战杯{赛道}，作品「{作品名}」获{特等奖/一等奖/二等奖}，个人负责{具体工作}"
  example: "组队参加第38届挑战杯，作品「基于大语言模型的代码审计系统」获一等奖，负责前端可视化模块"

- type: 实验室科研
  description: 在导师实验室参与课题研究，可能产出论文
  common_roles: [研究助理, 实习生]
  writing_template: "在{实验室名}（{导师}教授课题组）担任研究助理，参与{研究方向}课题，负责{具体工作}，产出{论文/实验平台/数据集}"
  example: "在自然语言处理实验室（刘知远教授课题组）担任研究助理，参与大模型对齐研究，负责RLHF数据标注流程，产出1篇 ACL 工作坊论文"

- type: 暑期科研（海外/校外）
  description: 暑期去海外高校或企业实验室做科研
  common_roles: [Visiting Student, Research Intern]
  writing_template: "暑期赴{学校/机构}（{实验室}）进行{时长}科研实习，课题为{课题名}，负责{具体工作}，{量化结果}"
  example: "暑期赴MIT CSAIL进行3个月科研实习，课题为多模态预训练，负责数据清洗pipeline，对比基线提升3.2%"

# ─── 实习经历 ───
- type: 大厂暑期实习
  description: 清华本科生常见的大厂暑期实习（6-9月）
  common_roles: [研发实习生, 算法实习生, 产品实习生]
  writing_template: "在{公司}（{部门}）担任{岗位}，负责{项目/模块}，主导{具体工作}，{量化结果}"
  example: "在字节跳动商业化技术部门担任前端开发实习生，负责广告投放系统重构，主导30+投放场景schema化改造，代码量下降45%"
  tips:
    - 清华学生实习多在大二大三暑假，突出实习中是否有return offer
    - 如果是算法岗，写出模型在业务中的实际效果（不是离线指标）
    - 如果是开发岗，写出系统影响面（QPS/用户数/线上效果）

- type: 创业实习
  description: 在创业公司的实习
  common_roles: [工程实习生, 联合创始人]
  writing_template: "在{公司}（{行业}创业公司）担任{岗位}，从0到1搭建{模块}，{量化结果}"
  example: "在某AI创业公司担任全栈实习生，从0到1搭建用户反馈系统，覆盖5000+日活用户"

# ─── 竞赛经历 ───
- type: ACM/ICPC
  description: 竞赛生核心经历
  writing_template: "校ACM集训队队员，{具体角色}，{赛事}获{奖项}（{排名}）"
  example: "校ACM集训队队员，第47届ICPC亚洲区域赛获金奖（队伍排名12）"
  tips: 如果是金牌/区域赛/World Finals级别，一定要写明具体赛事名和排名

- type: 数学建模竞赛
  description: 国赛/美赛
  writing_template: "{赛事}获{奖项}，负责{建模/编程/写作}，选题「{题目}」"
  example: "美国大学生数学建模竞赛(MCM)获Outstanding Winner，负责建模和编程，选题「气候变化对生态影响」"

- type: 超算竞赛
  description: ASC/ISC/SC 等超算竞赛
  writing_template: "参加{赛事}，团队{奖项}，负责{优化方向/系统调优}"
  example: "参加ASC24世界大学生超算竞赛获一等奖，负责HPL优化，达到93%浮点峰值效率"

- type: 其他学科竞赛
  description: 全国大学生电子设计竞赛、信息安全竞赛、物理学术竞赛等
  writing_template: "{赛事}获{奖项}，负责{具体工作}"
  example: "全国大学生信息安全竞赛获一等奖，负责漏洞挖掘模块，发现3个CVE"

# ─── 学生工作 / 社团 ───
- type: 学生会 / 科协
  description: 清华校内最大的学生组织
  common_roles: [部长, 副主席, 干事]
  writing_template: "在{组织}（{部门}）担任{职务}，{主导/组织}{活动/项目}，{量化结果}"
  example: "在计算机系科协担任技术部副部长，组织系内编程大赛，参赛人数120+"
  tips:
    - 清华科协/学生会经历对技术岗简历是加分项，但不宜占太多篇幅
    - 重点写「你做了什么」而不是「组织有多大」

- type: 社团 / 俱乐部
  description: 清华有上百个学生社团
  writing_template: "在{社团名}担任{职务}，{具体贡献}"
  example: "在TMS（清华大学马克思主义学习研究协会）担任宣传部长，运营公众号粉丝1000+"

# ─── 特色经历 ───
- type: 马约翰杯体育竞赛
  description: 清华校内体育赛事
  writing_template: "参加马杯{项目}获{奖项}"
  example: "参加马杯男篮获系际赛季前八"
  tips: 简短提及即可，体现综合素质

- type: 志愿服务
  description: 清华鼓励学生参与志愿服务
  writing_template: "参与{志愿项目}，{具体工作}，{时长/人次}"
  example: "参与支教活动赴河南某中学，教授编程课2周，覆盖60名学生"

- type: 国防 / 定向生经历
  description: 清华有国防生和定向生项目
  writing_template: "作为{国防生/定向生}，{特殊经历/训练/实习}"
  example: "作为定向生，赴{单位}进行专业实习3个月"
  tips: 定向生简历应突出专业实习和技术能力，弱化军事训练细节
