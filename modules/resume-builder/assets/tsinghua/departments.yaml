# 清华大学院系 / 专业 / 核心课程映射
# Agent 收集教育背景时根据院系自动推荐核心课程，避免学生遗漏重要课程
# 学生不必全填，从列表中挑选自己修过且与求职方向相关的即可

# ─── 信息学院 ───
- faculty: 信息科学技术学院
  departments:
    - name: 计算机科学与技术系
      majors: [计算机科学与技术, 计算机科学实验班, 计算机金融双学位]
      core_courses: [数据结构, 算法设计, 操作系统, 计算机组成原理, 计算机网络, 编译原理, 人工智能导论, 机器学习, 计算机系统结构, 形式语言与自动机, 数据库系统, 软件工程, 计算理论, 密码学基础]
      hot_courses: [深度学习, 自然语言处理, 计算机视觉, 分布式系统, 大数据系统, 云计算, 区块链技术与实践]

    - name: 电子工程系
      majors: [电子信息科学与技术, 电子信息工程]
      core_courses: [信号与系统, 数字信号处理, 通信电路, 电磁场与电磁波, 微波技术, 通信原理, 信息论基础, 模拟电子技术, 数字电子技术, 模式识别, 自动控制原理]
      hot_courses: [图像处理, 语音信号处理, 雷达原理, 光通信, 射频电路设计]

    - name: 自动化系
      majors: [自动化, 自动化工业工程方向]
      core_courses: [自动控制原理, 现代控制理论, 信号与系统, 模式识别, 运筹学, 系统工程, 机器人学, 人工智能导论, 计算机视觉, 运动体控制]
      hot_courses: [无人驾驶, 智能机器人, 机器学习, 强化学习, 工业互联网, 数字孪生]

    - name: 软件学院
      majors: [软件工程]
      core_courses: [软件工程, 数据结构, 操作系统, 计算机网络, 数据库系统, 面向对象设计与分析, 软件体系结构, 软件测试, 大数据系统, 云计算]
      hot_courses: [微服务架构, DevOps, 软件安全, 区块链, 人工智能工程实践]

# ─── 理学院 ───
- faculty: 理学院
  departments:
    - name: 数学科学系
      majors: [数学与应用数学, 计算数学, 基础科学班]
      core_courses: [数学分析, 高等代数, 解析几何, 常微分方程, 偏微分方程, 复分析, 实分析, 泛函分析, 抽象代数, 拓扑学, 概率论与数理统计]
      hot_courses: [数值分析, 最优化方法, 随机过程, 图论, 数论]

    - name: 物理系
      majors: [物理学, 应用物理学]
      core_courses: [普通物理, 分析力学, 电动力学, 量子力学, 热力学与统计物理, 固体物理, 光学, 原子物理, 计算物理]
      hot_courses: [凝聚态物理, 量子信息, 激光物理, 半导体物理]

    - name: 化学系
      majors: [化学]
      core_courses: [无机化学, 有机化学, 物理化学, 分析化学, 仪器分析, 高分子化学, 结构化学, 波谱分析]

    - name: 生命科学学院
      majors: [生物科学, 生物信息学]
      core_courses: [普通生物学, 生物化学, 细胞生物学, 遗传学, 分子生物学, 微生物学, 生物信息学, 结构生物学]

# ─── 工学院 ───
- faculty: 工学院
  departments:
    - name: 航天航空学院
      majors: [航空航天工程, 工程力学]
      core_courses: [理论力学, 材料力学, 流体力学, 空气动力学, 飞行器设计, 推进原理, 航天器动力学, 有限元方法]

    - name: 机械工程系
      majors: [机械工程]
      core_courses: [工程力学, 机械设计, 机械制造, 控制工程, 材料科学, 流体传动, 机电一体化, CAD/CAM]

    - name: 精密仪器系
      majors: [测控技术与仪器, 精密仪器]
      core_courses: [精密机械设计, 光学工程, 传感器技术, 信号处理, 测控电路, 仪器智能化, 机器视觉]

    - name: 能源与动力工程系
      majors: [能源与动力工程]
      core_courses: [工程热力学, 流体力学, 传热学, 燃烧学, 能源转换, 动力机械, 新能源技术]

    - name: 车辆与运载学院
      majors: [车辆工程]
      core_courses: [汽车构造, 汽车理论, 汽车设计, 车辆动力学, 动力系统, 新能源汽车, 自动驾驶]

    - name: 工业工程系
      majors: [工业工程]
      core_courses: [运筹学, 生产管理, 人因工程, 物流与供应链, 质量管理, 系统工程, 工程经济学]

# ─── 建筑学院 ───
- faculty: 建筑学院
  departments:
    - name: 建筑系
      majors: [建筑学]
      core_courses: [建筑设计, 建筑历史, 建筑构造, 城市规划, 建筑物理, 建筑结构]

    - name: 土木水利学院
      majors: [土木工程, 水利水电工程, 建筑环境与能源应用工程]
      core_courses: [结构力学, 流体力学, 土力学, 混凝土结构, 钢结构, 水文学, 暖通空调]

# ─── 经管 / 公管 ───
- faculty: 经济管理学院
  departments:
    - name: 经济管理学院
      majors: [经济与金融, 工商管理, 会计学, 信息管理与信息系统]
      core_courses: [微观经济学, 宏观经济学, 计量经济学, 金融学, 公司金融, 投资学, 会计学, 运营管理, 市场营销, 战略管理, 统计学]
      hot_courses: [金融工程, 量化投资, 数据挖掘, 商业分析, 供应链管理]

- faculty: 公共管理学院
  departments:
    - name: 公共管理学院
      majors: [公共管理, 国际关系]
      core_courses: [公共管理学, 政策分析, 公共经济学, 统计学, 研究方法]

# ─── 交叉学科 ───
- faculty: 交叉信息研究院
  departments:
    - name: 交叉信息研究院
      majors: [计算机科学实验班（姚班）, 量子信息班]
      core_courses: [计算理论, 算法设计, 密码学, 量子计算, 信息论, 分布式算法, 博弈论]
      note: 姚班学生通常有极强的科研背景，简历应突出论文和竞赛

- faculty: 新雅书院
  departments:
    - name: 新雅书院
      majors: [通识教育（文理基础）]
      core_courses: [文明溯源, 文学经典, 哲学导论, 科学通史, 逻辑与批判性思维]
      note: 通识教育背景，学生后续分流到各专业，简历应注明分流专业

