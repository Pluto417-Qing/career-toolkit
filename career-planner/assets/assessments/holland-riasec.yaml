# Holland (RIASEC) 简版测评题库
# 60 题版：每题一句陈述，用户从 1-5 打分（1=非常不同意，5=非常同意）
# 每个维度 10 题，总分越高代表在该维度倾向越强
#
# 六维度：
#   R (Realistic 现实型)    动手、机械、户外
#   I (Investigative 研究型) 分析、逻辑、抽象
#   A (Artistic 艺术型)      创造、审美、表达
#   S (Social 社会型)         助人、教育、沟通
#   E (Enterprising 企业型)   领导、说服、经营
#   C (Conventional 常规型)   规范、数据、事务

version: 1
scale: [1, 5]
dimensions:
  R:
    name: 现实型 Realistic
    description: 偏好动手、操作物件、机械与户外的工作
  I:
    name: 研究型 Investigative
    description: 偏好分析、思考与解决抽象问题
  A:
    name: 艺术型 Artistic
    description: 偏好创作、审美与自由表达
  S:
    name: 社会型 Social
    description: 偏好帮助、教育与与人沟通
  E:
    name: 企业型 Enterprising
    description: 偏好领导、说服、组织与经营
  C:
    name: 常规型 Conventional
    description: 偏好规范、数据、事务处理

items:
  # ---- R ----
  - {id: 1,  dim: R, text: 我喜欢动手拆装、修理机械或设备}
  - {id: 2,  dim: R, text: 我更愿意在户外或车间等实体场景工作}
  - {id: 3,  dim: R, text: 我对电子/机械/工具类操作类课程有兴趣}
  - {id: 4,  dim: R, text: 相比抽象讨论，我更喜欢直接动手做出成品}
  - {id: 5,  dim: R, text: 我愿意学习使用新硬件设备}
  - {id: 6,  dim: R, text: 我能长时间专注在一件实操类工作上}
  - {id: 7,  dim: R, text: 我喜欢做需要一定体力或操作技能的活动}
  - {id: 8,  dim: R, text: 我对工艺、木工、DIY 感兴趣}
  - {id: 9,  dim: R, text: 我更倾向于确定结果的实操类任务}
  - {id: 10, dim: R, text: 我曾主动学习一门操作型技能（如驾驶、烹饪、乐器）}

  # ---- I ----
  - {id: 11, dim: I, text: 我喜欢分析事物背后的原理}
  - {id: 12, dim: I, text: 遇到不懂的问题我会先自己研究}
  - {id: 13, dim: I, text: 我对科学、数据、统计相关话题有兴趣}
  - {id: 14, dim: I, text: 我喜欢阅读专业书籍或论文}
  - {id: 15, dim: I, text: 我愿意花时间独立思考复杂问题}
  - {id: 16, dim: I, text: 我更喜欢结构化、可推理的问题而不是感性判断}
  - {id: 17, dim: I, text: 我常问"为什么"和"怎么办到"}
  - {id: 18, dim: I, text: 我喜欢通过实验或数据验证假设}
  - {id: 19, dim: I, text: 我对研究报告、白皮书类内容感兴趣}
  - {id: 20, dim: I, text: 我在同伴中经常扮演分析者/思考者角色}

  # ---- A ----
  - {id: 21, dim: A, text: 我喜欢创作（写作、绘画、音乐、视频、设计等）}
  - {id: 22, dim: A, text: 我看重工作是否有创造性和表达空间}
  - {id: 23, dim: A, text: 我对美学、造型、色彩敏感}
  - {id: 24, dim: A, text: 我更希望工作节奏灵活而不是死板}
  - {id: 25, dim: A, text: 我常有跳出常规的想法}
  - {id: 26, dim: A, text: 我喜欢原创比复现更多}
  - {id: 27, dim: A, text: 我曾主动做过与"表达/创作"相关的作品}
  - {id: 28, dim: A, text: 我关注文化、艺术、影视、设计动向}
  - {id: 29, dim: A, text: 我愿意接受不确定性以换取表达自由}
  - {id: 30, dim: A, text: 我讨厌所有事情都被规则约束}

  # ---- S ----
  - {id: 31, dim: S, text: 我喜欢帮助别人解决问题}
  - {id: 32, dim: S, text: 我在小组中常担任协调或倾听角色}
  - {id: 33, dim: S, text: 我对教育、心理、公益类话题感兴趣}
  - {id: 34, dim: S, text: 我能耐心地向别人解释一件事}
  - {id: 35, dim: S, text: 我看重工作对他人和社会的意义}
  - {id: 36, dim: S, text: 我愿意花时间和不同背景的人交流}
  - {id: 37, dim: S, text: 我对"服务用户/服务学生"的角色感到自然}
  - {id: 38, dim: S, text: 我曾主动组织或参加志愿者/公益活动}
  - {id: 39, dim: S, text: 我倾向于共赢而不是零和竞争}
  - {id: 40, dim: S, text: 别人评价我是一个"暖 / 好相处 / 靠谱"的人}

  # ---- E ----
  - {id: 41, dim: E, text: 我喜欢在团队中带头做事}
  - {id: 42, dim: E, text: 我对商业、销售、创业类话题感兴趣}
  - {id: 43, dim: E, text: 我擅长说服别人接受我的观点}
  - {id: 44, dim: E, text: 我在乎工作的影响力和话语权}
  - {id: 45, dim: E, text: 我愿意为达成目标承担一定风险}
  - {id: 46, dim: E, text: 我曾主动发起活动或项目并推动落地}
  - {id: 47, dim: E, text: 我在竞争中会感到兴奋而不是焦虑}
  - {id: 48, dim: E, text: 我关注机会成本，倾向选高回报的选项}
  - {id: 49, dim: E, text: 我愿意花心思拓展人脉}
  - {id: 50, dim: E, text: 我认为决策速度比完美更重要}

  # ---- C ----
  - {id: 51, dim: C, text: 我喜欢有明确规则和流程的工作}
  - {id: 52, dim: C, text: 我做事习惯记录、归档、清单化}
  - {id: 53, dim: C, text: 我对数字、账目、表格类工作不排斥反而觉得踏实}
  - {id: 54, dim: C, text: 我在乎工作的稳定和可预期}
  - {id: 55, dim: C, text: 我能长时间做重复但重要的事务性工作}
  - {id: 56, dim: C, text: 我更愿意在成熟组织按规范做事而不是从零创造}
  - {id: 57, dim: C, text: 我对细节和一致性敏感}
  - {id: 58, dim: C, text: 我倾向于风险规避}
  - {id: 59, dim: C, text: 我认为按流程做事比灵活变通更靠谱}
  - {id: 60, dim: C, text: 我愿意为"编制/事业/公务"的稳定性放弃部分弹性}

interpretation:
  # 结果解读：取前 3 高维度组成 Holland Code（如 SIA、ICR）
  # 每个维度总分范围 10-50，可换算为 0-100 = (score-10)/40*100
  top_k: 3
  path_hints:
    IRC: [数据分析师, 系统工程师, 数据库/后端开发]
    ICR: [算法工程师, 数据科学, 量化研究]
    IAS: [产品经理, UX 研究, 用户运营]
    ASE: [市场/品牌, 内容创作, 设计, 前端]
    SEC: [人力资源, 教育培训, 客户成功]
    ECR: [咨询, 战略, 项目管理, 运营]
    RIC: [硬件/嵌入式, 工程质量, 制造管理]
    SIA: [产品经理, 用户研究, 心理咨询, 教育]
    ECS: [销售, 市场, BD, 客户经理]
    CSE: [公务员/事业单位, 财务, 审计, 行政管理]
